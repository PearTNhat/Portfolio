<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background with Cyber Gradient Border -->
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="#080c14"/>
  
  <!-- LTN Monogram Text -->
  <text 
    x="50%" 
    y="53%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace" 
    font-weight="900" 
    font-size="23" 
    fill="#22d3ee" 
    letter-spacing="-1"
  >LTN</text>
</svg>
